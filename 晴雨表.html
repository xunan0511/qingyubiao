<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="晴雨表">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#DCEBF7">
<title>晴雨表</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23DFF1E4'/><g fill='%23A8D8C0' opacity='.55'><circle cx='22' cy='22' r='7'/><circle cx='68' cy='14' r='7'/><circle cx='120' cy='26' r='7'/><circle cx='160' cy='16' r='7'/><circle cx='14' cy='72' r='7'/><circle cx='166' cy='74' r='7'/><circle cx='18' cy='128' r='7'/><circle cx='164' cy='132' r='7'/><circle cx='24' cy='168' r='7'/><circle cx='74' cy='170' r='7'/><circle cx='126' cy='164' r='7'/><circle cx='160' cy='170' r='7'/></g><circle cx='90' cy='96' r='46' fill='%2380B4DC'/><ellipse cx='90' cy='52' rx='20' ry='9' fill='%23FFFFFF'/><path d='M90 52 q-26 -20 -34 -4 q18 10 34 4z' fill='%23FFFFFF'/><path d='M90 52 q26 -20 34 -4 q-18 10 -34 4z' fill='%23FFFFFF'/></svg>">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23DFF1E4'/><circle cx='90' cy='96' r='46' fill='%2380B4DC'/><ellipse cx='90' cy='52' rx='20' ry='9' fill='%23FFFFFF'/><path d='M90 52 q-26 -20 -34 -4 q18 10 34 4z' fill='%23FFFFFF'/><path d='M90 52 q26 -20 34 -4 q-18 10 -34 4z' fill='%23FFFFFF'/></svg>">
<style>
:root{
  --blue:#80B4DC;
  --green:#A8D8C0;
  --ink:#3F5A6E;
  --ink2:#7C93A6;
  --card:#FFFFFF;
  --line:#E4EEF6;
  --shadow:0 6px 20px rgba(128,180,220,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#EDF5FB 0%,#F7FBFE 100%);
  color:var(--ink);overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
.wrap{max-width:460px;margin:0 auto;padding:18px 16px 130px;min-height:100vh;}
.screen{display:none;animation:fadeIn .32s ease;}
.screen.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sub{font-size:12.5px;color:var(--ink2);margin-bottom:18px;letter-spacing:.4px;line-height:1.6;}
.btn{
  border:none;border-radius:14px;padding:12px 18px;font-size:14.5px;
  font-weight:500;background:var(--card);color:var(--ink);
  box-shadow:var(--shadow);font-family:inherit;letter-spacing:.5px;
  transition:transform .16s;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,var(--blue),#9AC8E8);color:#fff;}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink2);box-shadow:none;border:1px solid var(--line);}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.topbar .title{font-size:16px;font-weight:600;letter-spacing:.6px;}
.pills{display:flex;gap:8px;flex-shrink:0;}
.pill{
  background:var(--card);border-radius:12px;padding:7px 12px;font-size:12px;
  color:var(--ink2);box-shadow:var(--shadow);border:none;font-family:inherit;
}
.pill:active{transform:scale(.95);}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.card{background:var(--card);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card.fixed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--green));}
.card .cname{font-size:15px;font-weight:600;margin-bottom:2px;cursor:pointer;}
.card .cname:active{color:var(--blue);}
.card .cmin{font-size:11.5px;color:var(--ink2);margin-bottom:10px;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepbtn{
  width:30px;height:30px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#EDF5FB,#E2EFF9);color:var(--ink);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:transform .14s;
}
.stepbtn:active{transform:scale(.86);}
.stepbtn.minus{color:var(--ink2);}
.stepnum{font-size:17px;font-weight:600;min-width:24px;text-align:center;}
.planlist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.planrow{background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.planrow.cur{border:1.5px solid var(--blue);}
.planrow .pname{font-size:14.5px;font-weight:500;}
.planrow .pmeta{font-size:11.5px;color:var(--ink2);margin-top:2px;}
.planrow .pnum{font-size:15px;font-weight:600;color:var(--blue);}
.planrow .pgo{
  border:none;background:linear-gradient(135deg,var(--blue),#9AC8E8);color:#fff;
  border-radius:11px;padding:8px 14px;font-size:13px;font-family:inherit;flex-shrink:0;
}
.planrow .pgo:active{transform:scale(.95);}
.recbox{background:linear-gradient(135deg,#F2F9FF,#EAF4FC);border-radius:16px;padding:14px 16px;margin-bottom:16px;border:1px solid #E0EEF8;}
.recbox .rt{font-size:12.5px;color:var(--ink2);margin-bottom:6px;letter-spacing:.5px;}
.recbox .rc{font-size:13.5px;line-height:1.75;}
.timerstage{
  position:relative;border-radius:26px;overflow:hidden;height:400px;margin-bottom:16px;
  background:linear-gradient(180deg,#D3E7F7 0%,#E8F3FB 60%,#F4FAFE 100%);
  box-shadow:var(--shadow);transition:background .8s;
}
.stage-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;}
.sun{
  position:absolute;left:50%;top:46%;width:112px;height:112px;margin:-56px 0 0 -56px;
  border-radius:50%;z-index:1;
  background:radial-gradient(circle at 40% 40%,#FFF6D8,#FFE9A8 55%,#FFD06B 100%);
  box-shadow:0 0 44px rgba(255,213,120,.5),0 0 92px rgba(255,213,120,.25);
  opacity:0;transform:scale(.5);transition:opacity 1.6s,transform 1.6s;
}
.sun.show{opacity:1;transform:scale(1);}
.clouds{position:absolute;inset:0;z-index:2;pointer-events:none;}
.cloud{
  position:absolute;border-radius:100px;background:rgba(255,255,255,.93);
  box-shadow:0 8px 26px rgba(140,180,215,.20);
  transition:opacity 1.8s,transform 2.2s;
}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.96);}
.rainlayer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.drop{
  position:absolute;top:-24px;width:7px;height:9px;background:rgba(150,198,232,.72);
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-30px);opacity:0;}
  12%{opacity:.85;}
  88%{opacity:.7;}
  100%{transform:translateY(430px);opacity:0;}
}
.ringwrap{position:relative;width:212px;height:212px;}
.ringwrap svg{transform:rotate(-90deg);display:block;}
.ringtrack{fill:none;stroke:rgba(255,255,255,.62);stroke-width:9;}
.ringbar{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s linear,stroke .4s;}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ringtime{font-size:42px;font-weight:300;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.ringsub{font-size:12.5px;color:var(--ink2);margin-top:6px;letter-spacing:1px;}
.stagebtns{display:flex;gap:12px;margin-top:22px;}
.stagebtns .btn{padding:11px 26px;}
.medals{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:9px 16px 14px;z-index:20;
}
.medals .mtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:7px;}
.medalrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;min-height:22px;}
.medalrow::-webkit-scrollbar{display:none;}
.medal{width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:#EAF2F8;border:1.5px solid #DCE8F2;transition:transform .3s,background .3s;}
.medal.lit{background:radial-gradient(circle at 35% 32%,#FFC7A6,#F08C63);border-color:#E88A5E;box-shadow:0 2px 8px rgba(240,140,99,.4);}
.medal.dim{background:radial-gradient(circle at 35% 32%,#F2E9D0,#D8C89A);border-color:#C9B98C;}
.medal.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{0%{transform:scale(.35)}62%{transform:scale(1.3)}100%{transform:scale(1)}}
.mask{
  position:fixed;inset:0;background:rgba(90,120,145,.28);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:24px;
}
.mask.on{display:flex;}
.modal{
  background:#fff;border-radius:22px;padding:22px 20px;width:100%;max-width:330px;
  box-shadow:0 20px 50px rgba(100,140,175,.28);
  animation:popIn .3s cubic-bezier(.2,1.4,.4,1);max-height:82vh;overflow-y:auto;
}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;margin:0 0 6px;font-weight:600;}
.modal .mhint{font-size:12px;color:var(--ink2);margin-bottom:16px;line-height:1.6;}
.optlist{display:flex;flex-direction:column;gap:9px;}
.opt{
  border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;
  font-size:14px;background:#fff;font-family:inherit;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.opt:active{transform:scale(.98);}
.opt.sel{border-color:var(--blue);background:#F3F9FE;color:var(--blue);font-weight:600;}
.opt .tag{font-size:11px;color:var(--ink2);font-weight:400;}
.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{border:1.5px solid var(--line);border-radius:11px;padding:9px 15px;font-size:13.5px;background:#fff;font-family:inherit;color:var(--ink);}
.chip.sel{border-color:var(--blue);background:#F3F9FE;color:var(--blue);font-weight:600;}
.chip:active{transform:scale(.96);}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--green));outline:none;margin:12px 0 4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);box-shadow:0 3px 8px rgba(128,180,220,.4);}
.sliderval{text-align:center;font-size:15px;font-weight:600;color:var(--blue);}
.modalbtns{display:flex;gap:10px;margin-top:18px;}
.modalbtns .btn{flex:1;padding:12px;}
.section-title{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:1px;margin:20px 0 10px;}
.reward{background:var(--card);border-radius:15px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;}
.rwicon{width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFC7A6,#F08C63);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.rwicon.ready{background:radial-gradient(circle at 35% 32%,#FFF0B8,#EEC642);color:#8A6A10;}
.rwbody{flex:1;min-width:0;}
.rwtxt{font-size:13.5px;line-height:1.5;}
.rwtxt.empty{color:#B8C9D6;font-style:italic;}
.rwprog{height:4px;border-radius:3px;background:#EEF5FA;margin-top:7px;overflow:hidden;}
.rwprog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .5s;}
.rwstate{font-size:11.5px;color:var(--ink2);margin-top:5px;}
.rwstate.ready{color:#E88A5E;font-weight:600;}
.toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(14px);
  background:rgba(63,90,110,.94);color:#fff;font-size:13px;padding:11px 20px;
  border-radius:14px;z-index:90;opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;max-width:80%;text-align:center;line-height:1.5;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.emptyhint{text-align:center;color:#B8C9D6;font-size:13px;padding:22px 0;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">

  <div class="screen on" id="screenPlan">
    <div class="topbar">
      <div class="title">今日计划</div>
      <div class="pills">
        <button class="pill" id="btnLang">英语</button>
        <button class="pill" id="btnElect">选科</button>
        <button class="pill" id="btnWeather">天气</button>
      </div>
    </div>
    <div class="sub" id="planDate">排好了点开始。中途随时能改。</div>

    <div class="recbox">
      <div class="rt">今日推荐</div>
      <div class="rc" id="recText">正在按理论给你排……</div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="stagebtns" style="margin:2px 0 6px;gap:9px;justify-content:center;">
      <button class="chip sel" id="planModeCd">倒计时</button>
      <button class="chip" id="planModeCu">正计时</button>
    </div>
    <button class="btn primary" id="btnStart" style="width:100%;padding:15px;font-size:16px;margin-bottom:18px;">开始</button>

    <div class="section-title">今天排的</div>
    <div class="planlist" id="planList"></div>

    <div class="section-title">常用组合</div>
    <div id="templates"></div>
    <button class="btn ghost" id="btnSaveTpl" style="width:100%;margin-top:10px;">把当前这套存成模板</button>

    <div class="section-title">奖励</div>
    <div id="rewardList"></div>
    <button class="btn ghost" id="btnAddReward" style="width:100%;margin-top:6px;">加一档</button>
  </div>

  <div class="screen" id="screenTimer">
    <div class="topbar">
      <div class="title" id="timerTitle">数学</div>
      <button class="pill" id="btnBack">返回计划</button>
    </div>

    <div class="timerstage" id="stage">
      <div class="sun" id="sun"></div>
      <div class="clouds" id="clouds"></div>
      <div class="rainlayer" id="rainlayer"></div>
      <div class="stage-inner">
        <div class="ringwrap">
          <svg width="212" height="212">
            <circle class="ringtrack" cx="106" cy="106" r="94"></circle>
            <circle class="ringbar" id="ringbar" cx="106" cy="106" r="94"></circle>
          </svg>
          <div class="ringcenter">
            <div class="ringtime" id="ringTime">25:00</div>
            <div class="ringsub" id="ringSub">准备</div>
          </div>
        </div>
        <div class="stagebtns">
          <button class="btn primary" id="btnPlay">开始</button>
          <button class="btn ghost" id="btnSkip">跳过</button>
        </div>
        <div class="stagebtns" style="margin-top:12px;gap:9px;">
          <button class="chip sel" id="modeCd">倒计时</button>
          <button class="chip" id="modeCu">正计时</button>
        </div>
      </div>
    </div>

    <div class="section-title">接下来</div>
    <div class="planlist" id="queue"></div>
  </div>

</div>

<div class="medals">
  <div class="mtop">
    <span id="medalCount">今天 0 个番茄</span>
    <span id="medalTotal">共 0 分钟</span>
  </div>
  <div class="medalrow" id="medalRow"></div>
</div>

<div class="mask" id="maskElect">
  <div class="modal">
    <h3>选科</h3>
    <div class="mhint">语数英固定。在下面六科里挑三科。</div>
    <div class="chips" id="electChips"></div>
    <div class="modalbtns">
      <button class="btn ghost" data-close="maskElect">取消</button>
      <button class="btn primary" id="btnElectOk">确定</button>
    </div>
  </div>
</div>

<div class="mask" id="maskLang">
  <div class="modal">
    <h3>外语</h3>
    <div class="mhint">外语那栏会跟着变。</div>
    <div class="optlist" id="langList"></div>
    <div class="modalbtns">
      <button class="btn ghost" data-close="maskLang">取消</button>
    </div>
  </div>
</div>

<div class="mask" id="maskTime">
  <div class="modal">
    <h3 id="timeTitle">语文 · 时长</h3>
    <div class="mhint">预设档点一下，滑条也能拖。</div>
    <div class="chips" id="timePresets"></div>
    <div style="margin-top:12px;">
      <input type="range" id="timeSlider" min="10" max="90" step="5">
      <div class="sliderval" id="timeVal">30 分钟</div>
    </div>
    <div class="modalbtns">
      <button class="btn ghost" data-close="maskTime">取消</button>
      <button class="btn primary" id="btnTimeOk">确定</button>
    </div>
  </div>
</div>

<div class="mask" id="maskMode">
  <div class="modal">
    <h3>平时怎么计时？</h3>
    <div class="mhint">选一个习惯，以后进来就是它。想改随时点页面上那两个钮。</div>
    <div class="optlist" id="modeList">
      <button class="opt" data-mode="countdown"><span>倒计时</span><span class="tag">到点提醒一声，方便收尾</span></button>
      <button class="opt" data-mode="countup"><span>正计时</span><span class="tag">往上数，不响不震</span></button>
    </div>
  </div>
</div>

<div class="mask" id="maskWeather">
  <div class="modal">
    <h3>选个天</h3>
    <div class="mhint">计时的时候，天会随时间散开。选一个你看着舒服的。</div>
    <div class="optlist">
      <button class="opt" data-weather="cloudy"><span>阴天</span><span class="tag">云厚一点，散得慢</span></button>
      <button class="opt" data-weather="rainy"><span>雨天</span><span class="tag">加点小雨，落完出太阳</span></button>
    </div>
  </div>
</div>

<div class="mask" id="maskReward">
  <div class="modal">
    <h3>这一档</h3>
    <div class="mhint">攒够这些番茄，换什么。想不出来就先空着。</div>
    <div class="chips" id="rwCountChips"></div>
    <div style="margin-top:14px;">
      <input type="text" id="rwText" placeholder="想不出来就先空着"
        style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;">
    </div>
    <div class="modalbtns">
      <button class="btn ghost" id="btnRwDel">删掉</button>
      <button class="btn primary" id="btnRwOk">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ========== 第一段：数据与状态 ========== */
var KEY='xunan_tomato_v2';
var LANGS=["英语","日语","俄语","德语","法语","西班牙语"];
var ELECT_POOL=["物理","化学","生物","政治","历史","地理"];
var BASE_MIN={"语文":30,"数学":45,"英语":25,"物理":45,"化学":40,"生物":30,"政治":25,"历史":30,"地理":30};
var DEFAULT_ELECT=["物理","化学","生物"];
var DEFAULT_REWARDS=[
  {count:3,text:""},
  {count:5,text:""},
  {count:10,text:""},
  {count:15,text:""},
  {count:20,text:""},
  {count:30,text:""}
];

var S={
  lang:"英语",
  elect:DEFAULT_ELECT.slice(),
  custom:{},
  plan:{},
  templates:[],
  weather:null,
  mode:null,
  date:today(),
  done:0,
  doneMin:0,
  finished:[],
  streak:0,
  best:0,
  lastDay:null,
  week:[],
  rewards:DEFAULT_REWARDS.map(function(r){return {count:r.count,text:r.text};}),
  rewarded:[]
};

function today(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function pad(n){return n<10?"0"+n:""+n;}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return;
    var o=JSON.parse(raw);
    for(var k in o){ if(S.hasOwnProperty(k)) S[k]=o[k]; }
    if(!S.rewards||!S.rewards.length) S.rewards=DEFAULT_REWARDS.map(function(r){return {count:r.count,text:r.text};});
    if(S.date!==today()){
      /* 跨天了：结算昨天的连续 */
      settleDay();
      S.date=today(); S.done=0; S.doneMin=0; S.finished=[]; S.plan={};
    }
  }catch(e){}
}

function activeSubjects(){

  return ["语文","数学",S.lang].concat(S.elect);

function subjectMin(name){
  if(S.custom[name]!=null) return S.custom[name];
  if(name===S.lang) return BASE_MIN["英语"];
  return BASE_MIN[name]!=null?BASE_MIN[name]:30;
}
function totalTomatoes(){
  var all=activeSubjects(); var t=0;
  all.forEach(function(n){ t+=(S.plan[n]||0); });
  return t;

function buildSequence(){
  var all=activeSubjects();
  var pool=[];
  all.forEach(function(n){
    var c=S.plan[n]||0;
    for(var i=0;i<c;i++) pool.push(n);
  });
  var seq=[], last=null, last2=null;
  while(pool.length){
    var pick=-1;
    for(var i=0;i<pool.length;i++){
      if(pool[i]!==last && pool[i]!==last2){ pick=i; break; }
    }
    if(pick<0) pick=0;
    var s=pool.splice(pick,1)[0];
    seq.push(s);
    last2=last; last=s;
  }
  return seq;
}

/* ========== 计时主循环 ========== */
function startTimer(subject,isBreak,minutes){
  T.subject=subject;
  T.break=!!isBreak;
  T.total=minutes*60;
  T.left=T.total;
  T.up=0;
  T.running=true;
  if(!isBreak) T.mode = T.mode || "countdown";
  cardsEl("timerTitle").textContent=isBreak?"休息":subject;
  cardsEl("ringSub").textContent=isBreak?"歇一会儿":(T.mode==="countup"?"自己数着":"专注中");
  cardsEl("btnPlay").textContent="暂停";
  syncModeUI();
  makeClouds();
  updateSky(0);
  drawRing();
  clearInterval(T.id);
  T.id=setInterval(tick,1000);
}
function tick(){
  if(!T.running) return;
  if(!T.break && T.mode==="countup"){
    /* 正计时：往上走，不响、不震、不弹，等你自己按完成 */
    T.up++;
    drawRing();
    return;
  }
  T.left--;
  if(T.left<0) T.left=0;
  drawRing();
  if(T.left<=0){ finishRound(); }
}
function drawRing(){
  var p;
  if(!T.break && T.mode==="countup"){
    var rec=subjectMin(T.subject)*60;
    p=rec>0?Math.min(1,T.up/(rec*2)):0;   /* 走满两倍推荐时长就是满圈 */
  }else{
    p=T.total?(1-T.left/T.total):0;
  }
  var bar=cardsEl("ringbar");
  bar.setAttribute("stroke-dasharray",RING_C);
  bar.setAttribute("stroke-dashoffset",RING_C*(1-p));
  bar.style.stroke=T.break?"var(--green)":"var(--blue)";
  if(!T.break && T.mode==="countup"){
    cardsEl("ringTime").textContent=fmt(T.up);
    var rec=subjectMin(T.subject)*60;
    cardsEl("ringSub").textContent="推荐 "+Math.round(rec/60)+" 分 · 到了按完成";
  }else{
    cardsEl("ringTime").textContent=fmt(T.left);
  }
  updateSky(p);
}

/* ========== 一个番茄结束 ========== */
/* 正计时折算：满推荐时长记 1，超额按比例加，封顶 2。返回分数（字符串） */
function creditFor(subject,seconds){
  var rec=subjectMin(subject)*60;
  if(rec<=0) return 1;
  var ratio=seconds/rec;
  if(ratio<=1) return 1;
  return Math.min(2, ratio);   /* 封顶 2 颗 */
}
/* 把小数折成"1 ⅓"这种分数写法 */
function fracText(v){
  var whole=Math.floor(v+1e-6);
  var f=v-whole;
  if(f<0.02) return ""+whole;
  var table=[[1/2,"1/2"],[1/3,"1/3"],[2/3,"2/3"],[1/4,"1/4"],[3/4,"3/4"],[1/5,"1/5"],[2/5,"2/5"],[3/5,"3/5"],[4/5,"4/5"]];
  var best="", bd=1;
  table.forEach(function(t){ var d=Math.abs(f-t[0]); if(d<bd){ bd=d; best=t[1]; } });
  if(!best) return v.toFixed(2);
  return (whole>0?whole+" ":"")+best;
}
function finishRound(){
  clearInterval(T.id);
  T.running=false;
  if(T.break){
    toast("歇好了，接着来。");
    nextInQueue();
    return;
  }
  /* 记一个番茄 —— 倒计时记 1 颗；正计时按溢出折算 */
  var credit=1;
  if(T.mode==="countup"){
    credit=creditFor(T.subject,T.up);
    S.doneMin+=Math.round(T.up/60);
  }else{
    S.doneMin+=Math.round(T.total/60);
  }
  S.done+=credit;
  S.done=Math.round(S.done*100)/100;   /* 免得浮点飘成 3.0000001 */
  if(S.finished.indexOf(T.subject)<0) S.finished.push(T.subject);
  /* 连续天数 */
  if(S.lastDay!==S.date){
    var y=new Date(); y.setDate(y.getDate()-1);
    var ystr=y.getFullYear()+"-"+pad(y.getMonth()+1)+"-"+pad(y.getDate());
    if(S.lastDay===ystr) S.streak+=1;
    else S.streak=1;
    if(S.streak>S.best) S.best=S.streak;
    S.lastDay=S.date;
  }
  save();
  renderMedals();
  renderRewards();
  /* 点亮动画 */
  var row=cardsEl("medalRow");
  var last=row.children[row.children.length-1];
  if(last){ last.classList.add("pop"); }
  /* 提醒：只有倒计时才震。正计时——一声不吭。 */
  if(T.mode!=="countup"){
    try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
  }
  var addTxt=(T.mode==="countup")?(" +"+fracText(credit)+" 颗"):"";
  toast("第 "+S.done+" 个。歇 5 分钟。");
  /* 进休息 */
  buildQueue();
  setTimeout(function(){
    startTimer(T.subject,true,5);
  },900);
}

  };
  cardsEl("btnTimeOk").onclick=function(){
    if(!editingTime) return;
    var v=+cardsEl("timeSlider").value;
    S.custom[editingTime]=v;
    save(); closeMask("maskTime"); renderAll();
  };

  /* 弹窗：奖励 */
  cardsEl("rwCountChips").onclick=function(e){
    var c=e.target.closest("[data-rc]");
    if(!c) return;
    cardsEl("rwCountChips").querySelectorAll(".chip").forEach(function(x){ x.classList.remove("sel"); });
    c.classList.add("sel");
  };
  cardsEl("btnRwOk").onclick=function(){
    var cnt=+ (cardsEl("rwCountChips").querySelector(".chip.sel")||{getAttribute:function(){return "3";}}).getAttribute("data-rc");
    var txt=cardsEl("rwText").value.trim();
    if(editingReward==null){
      S.rewards.push({count:cnt,text:txt});
    }else{
      S.rewards[editingReward]={count:cnt,text:txt};
    }
    S.rewards.sort(function(a,b){return a.count-b.count;});
    save(); closeMask("maskReward"); renderAll();
  };
  cardsEl("btnRwDel").onclick=function(){
    if(editingReward!=null){ S.rewards.splice(editingReward,1); save(); }
    closeMask("maskReward"); renderAll();
  };
  cardsEl("btnAddReward").onclick=function(){ openRewardModal(null); };

  /* 存模板 */
  cardsEl("btnSaveTpl").onclick=function(){
    var counts={};
    for(var n in S.plan){ if(S.plan[n]) counts[n]=S.plan[n]; }
    if(!Object.keys(counts).length){ toast("先排几个再说。"); return; }
    var name=prompt("这套叫什么？","常用一套");
    if(name===null) return;
    S.templates.push({name:name||"常用一套",counts:counts});
    save(); renderAll(); toast("存好了。");
  };

  /* 计划页：模式选择 + 开始 */
  cardsEl("planModeCd").onclick=function(){
    T.mode="countdown"; syncModeUI();
  };
  cardsEl("planModeCu").onclick=function(){
    T.mode="countup"; syncModeUI();
  };
  cardsEl("btnStart").onclick=function(){
    buildQueue();
    if(!T.queue.length){ toast("上面还没排。先点卡片的 + 加几个番茄。"); return; }
    var first=T.queue.shift();
    T.mode=T.mode||"countdown";
    showScreen("screenTimer");
    startTimer(first,false,subjectMin(first));
    renderQueue();
  };

  /* 计时页按钮 */
  cardsEl("btnPlay").onclick=function(){
    if(!T.subject) return;
    if(T.running){ pauseTimer(); return; }
    if(T.total<=0 && T.up<=0){
      /* 还没起过：按当前科目和时间起一个 */
      startTimer(T.subject,false,subjectMin(T.subject));
    }else{
      resumeTimer();
    }
  };
  cardsEl("btnSkip").onclick=function(){
    if(!T.subject) return;
    if(T.mode==="countup" && !T.break){
      /* 正计时下这个按钮是"完成"：按走过的时间折算收掉 */
      finishRound();
      return;
    }
    clearInterval(T.id);
    nextInQueue();
  };
  /* 模式切换：倒计时 / 正计时 */
  cardsEl("modeCd").onclick=function(){
    T.mode="countdown";
    syncModeUI();
  };
  cardsEl("modeCu").onclick=function(){
    T.mode="countup";
    /* 切到正计时：正在跑的这一次，从 0 往上数 */
    syncModeUI();
  };
  cardsEl("btnBack").onclick=function(){
    T.running=false; clearInterval(T.id);
    showScreen("screenPlan");
  };
}

function renderElectChips(){
  var box=cardsEl("electChips");
  var h="";
  ELECT_POOL.forEach(function(n){
    h+='<button class="chip'+(electTemp.indexOf(n)>=0?" sel":"")+'" data-el="'+n+'">'+n+'</button>';
  });
  box.innerHTML=h;
  if(!box._bound){
    box._bound=true;
    box.addEventListener("click",function(e){
      var c=e.target.closest("[data-el]");
      if(!c) return;
      var n=c.getAttribute("data-el");
      var i=electTemp.indexOf(n);
      if(i>=0) electTemp.splice(i,1);
      else{
        if(electTemp.length>=3){ toast("最多挑三科。"); return; }
        electTemp.push(n);
      }
      renderElectChips();
    });
  }
}

function openTimeModal(name){
  editingTime=name;
  cardsEl("timeTitle").textContent=name+" · 时长";
  var cur=subjectMin(name);
  var presets=[10,15,20,25,30,35,40,45,50,60];
  var h="";
  presets.forEach(function(p){
    h+='<button class="chip'+(p===cur?" sel":"")+'" data-min="'+p+'">'+p+'</button>';
  });
  cardsEl("timePresets").innerHTML=h;
  cardsEl("timeSlider").value=cur;
  cardsEl("timeVal").textContent=cur+" 分钟";
  openMask("maskTime");
}

function openRewardModal(idx){
  editingReward=idx;
  var cur={count:3,text:""};
  if(idx!=null&&S.rewards[idx]) cur=S.rewards[idx];
  var counts=[3,5,10,15,20,30,40,50];
  var h="";
  counts.forEach(function(c){
    h+='<button class="chip'+(c===cur.count?" sel":"")+'" data-rc="'+c+'">'+c+'</button>';
  });
  cardsEl("rwCountChips").innerHTML=h;
  cardsEl("rwText").value=cur.text||"";
  cardsEl("btnRwDel").style.display=(idx==null?"none":"block");
  openMask("maskReward");
}

/* ========== 总渲染 ========== */
function renderAll(){
  cardsEl("btnLang").textContent=S.lang;
  renderCards();
  renderPlan();
  renderMedals();
  renderQueue();
}

/* ========== 启动 ========== */
function boot(){
  load();
  bindAll();
  /* 档里没定过计时习惯：先问这个 */
  if(!S.mode){
    openMask("maskMode");
  } else if(!S.weather){
    /* 习惯定过了、天气还没定：直接问天气 */
    openMask("maskWeather");
  }
  renderAll();
  /* 保存今日基线，用于跨天 */
  if(!S.date) S.date=today();
}
boot();

    "</svg>");
  var mf={

    start_url:".", scope:".",
    display:"standalone", orientation:"portrait",
    background_color:"#F4FAFE", theme_color:"#DCEBF7",
    icons:[{src:icon, sizes:"180x180", type:"image/svg+xml", purpose:"any"}]
  };
  var blob=new Blob([JSON.stringify(mf)], {type:"application/manifest+json"});
  var link=document.createElement("link");
  link.rel="manifest";
  link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);

  /* 手机浏览器地址栏收起来（有些认这条） */
  var mv=document.querySelector('meta[name=viewport]');
